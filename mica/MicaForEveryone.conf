# Mica For Everyone — stronger Acrylic + BlurBehind so Explorer shows wallpaper
# through the window instead of just a subtle Mica tint.

Global {
  TitleBarColor             = Dark
  BackdropPreference        = Acrylic
  CornerPreference          = Default
  ExtendFrameIntoClientArea = True
  EnableBlurBehind          = True
}

# Exclude yasb — it has its own blur effect; stacking Mica on top double-blurs
Process: "yasb" {
  BackdropPreference        = None
  EnableBlurBehind          = False
  ExtendFrameIntoClientArea = False
}

# File Explorer windows — styled by Windhawk "File Explorer Styler" (TintedGlass);
# MFE backdrop/blur disabled here so the two do not stack.
Class: "CabinetWClass" {
  TitleBarColor             = Dark
  BackdropPreference        = Default
  ExtendFrameIntoClientArea = False
  EnableBlurBehind          = False
}

# Explorer dialogs (Open/Save/Properties)
Class: "#32770" {
  TitleBarColor             = Dark
  BackdropPreference        = Acrylic
  EnableBlurBehind          = True
}

# Console host (legacy cmd/powershell windows)
Class: "ConsoleWindowClass" {
  TitleBarColor             = Dark
  BackdropPreference        = Acrylic
  ExtendFrameIntoClientArea = True
}

Process: "SystemSettings" {
  TitleBarColor      = Dark
  BackdropPreference = Acrylic
  EnableBlurBehind   = True
}

Process: "notepad" {
  TitleBarColor      = Dark
  BackdropPreference = Acrylic
  EnableBlurBehind   = True
}

# Task Manager — acrylic translucent to match wallpaper
Process: "Taskmgr" {
  TitleBarColor             = Dark
  BackdropPreference        = Acrylic
  ExtendFrameIntoClientArea = True
  EnableBlurBehind          = True
}
